name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} 正在部署应用 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码 (使用你指定的写法)
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # 2. 安装 kubectl（国内极速安装 + 验证）
      - name: Install kubectl
        run: |
          # 使用阿里云镜像源极速下载
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # 验证 kubectl 是否安装成功
          echo "🔍 正在验证 kubectl 安装情况..."
          if ! command -v kubectl &> /dev/null; then
              echo "❌ 致命错误: kubectl 安装失败，未找到命令！"
              exit 1
          fi
          kubectl version --client
          echo "✅ kubectl 安装验证通过！"

      # 3. 登录 Docker Hub（如果你用的是阿里云/腾讯云，请替换对应地址）


      # 4. 构建 Docker 镜像并推送到远程仓库
      - name: Build and push Docker image
        run: |
          # 给镜像打上标签（这里用 git 的提交哈希作为版本号，方便回溯）
          IMAGE_TAG="${{ gitea.repository }}:${{ gitea.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # 5. 部署到 Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          # 把凭证写入容器，让 kubectl 能找到集群
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          
          # 替换 deployment.yaml 里的镜像版本（假设你的 k8s yaml 里镜像字段叫 IMAGE_TAG）
          sed -i "s|IMAGE_TAG|${{ gitea.repository }}:${{ gitea.sha }}|g" deployment.yaml
          
          # 执行部署并等待 rollout 完成
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/auto-call-phone --timeout=90s