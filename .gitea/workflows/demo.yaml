name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} 正在部署应用 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 【方案二核心】：指定一个包含所有工具（Docker, kubectl等）的镜像
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      # 1. 拉取代码
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # 2. 验证工具是否可用（可选，用于排查错误）
      - name: Verify Tools
        run: |
          kubectl version --client
          docker version
      # 5. 部署到 Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          # 配置 K8s 凭证
          echo "$KUBECONFIG_DATA"
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          
          # 替换 deployment.yaml 里的镜像占位符（假设你文件中写的是 IMAGE_TAG）
          # 注意这里使用了 $FULL_IMAGE_NAME 环境变量
          sed -i "s|IMAGE_TAG|$FULL_IMAGE_NAME|g" deployment.yaml
          
          # 执行部署
          kubectl apply -f deployment.yaml
          
          # 验证部署状态
          kubectl rollout status deployment/auto-call-phone --timeout=90s