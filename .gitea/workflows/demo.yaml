name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} 正在部署应用 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 核心：改用国内华为云 SWR 代理同步的高速镜像
    # 1. 彻底解决国内网络无法直接拉取 ghcr.io 的报错
    # 2. 该镜像内置了 Node.js 环境，彻底解决在容器中无法运行 uses 动作的问题
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/catthehacker/ubuntu:act-latest

    steps:
      # 1. 正常使用 uses 运行 checkout（由于国内加速镜像内有 Node.js，此处可正常且快速执行）
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # 2. 正常使用 uses 运行 kubectl 安装
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.2'

      # 3. 部署到 Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          FULL_IMAGE_NAME: ${{ secrets.GITEA_REGISTRY_URL }}/${{ gitea.repository }}:${{ gitea.sha }}
        run: |
          # 配置 K8s 凭证
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          # 【临时调试】直接在控制台打印解密后的 Kubeconfig 完整内容，便于排查格式
          echo "=== ⏳ 正在打印解密后的 Kubeconfig 完整内容 ==="
          cat $HOME/.kube/config
          echo "=========================================="
          
          # 替换 deployment.yaml 里的镜像占位符 IMAGE_TAG
          sed -i "s|IMAGE_TAG|$FULL_IMAGE_NAME|g" deployment.yaml
          
          # 执行部署
          kubectl apply -f deployment.yaml
          
          # 验证部署状态
          kubectl rollout status deployment/auto-call-phone --timeout=90s