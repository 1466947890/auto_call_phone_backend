name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} triggered a deployment 🚀
on: [push]

jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # ==========================================
      # 🛡️ 2. 【前置预检】写入凭证并验证环境
      # ==========================================
      - name: Pre-check K8s Environment
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          echo "🔍 [Pre-check] 正在验证 kubectl 工具..."
          if ! command -v kubectl &> /dev/null; then
              echo "❌ 致命错误: 当前 Runner 环境中未找到 kubectl 命令！"
              exit 1
          fi

          echo "🔑 [Pre-check] 正在写入 kubeconfig 凭证..."
          mkdir -p $HOME/.kube
          printf "%s" "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          
          if ! kubectl get nodes &> /dev/null; then
              echo "❌ 致命错误: kubeconfig 无效或无法连接到 Kubernetes 集群！"
              exit 1
          fi
          echo "✅ [Pre-check] 环境验证通过，准备开始构建镜像..."

      # 3. 构建本地 Docker 镜像
      - name: Build Docker Image
        run: |
          docker build -t auto-call-phone:latest .

      # 4. 部署到 Kubernetes
      - name: Deploy with Kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # 写入凭证，让 Runner 自带的 kubectl 能连接到集群
          mkdir -p $HOME/.kube
          printf "%s" "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/auto-call-phone --timeout=90s