name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} 正在部署应用 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 【方案二核心】：指定一个包含所有工具（Docker, kubectl等）的镜像
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      # 1. 拉取代码
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # 2. 验证工具是否可用（可选，用于排查错误）
      - name: Verify Tools
        run: |
          kubectl version --client
          docker version

      # 3. 登录 Docker Hub
      # 注意：需要在 Gitea 项目设置中添加 DOCKER_USERNAME 和 DOCKER_PASSWORD
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. 构建 Docker 镜像并推送到远程仓库
      - name: Build and push Docker image
        run: |
          # 定义镜像标签并存入环境变量供后续步骤使用
          IMAGE_TAG="${{ gitea.repository }}:${{ gitea.sha }}"
          echo "FULL_IMAGE_NAME=$IMAGE_TAG" >> $GITEA_ENV
          
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # 5. 部署到 Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          # 配置 K8s 凭证
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          
          # 替换 deployment.yaml 里的镜像占位符（假设你文件中写的是 IMAGE_TAG）
          # 注意这里使用了 $FULL_IMAGE_NAME 环境变量
          sed -i "s|IMAGE_TAG|$FULL_IMAGE_NAME|g" deployment.yaml
          
          # 执行部署
          kubectl apply -f deployment.yaml
          
          # 验证部署状态
          kubectl rollout status deployment/auto-call-phone --timeout=90s