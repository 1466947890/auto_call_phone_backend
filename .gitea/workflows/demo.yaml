name: Auto-Call-Phone CI/CD
run-name: ${{ gitea.actor }} triggered a deployment 🚀

on: [push]

jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4

      # ==========================================
      # 🛡️ 2. 【前置预检】在耗时操作前验证环境
      # ==========================================
      - name: Pre-check K8s Environment
        container:
          image: bitnami/kubectl:latest 
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          echo "🔍 [Pre-check] 正在验证 kubectl 工具..."
          if ! command -v kubectl &> /dev/null; then
              echo "❌ 致命错误: 当前环境中未找到 kubectl 命令！"
              exit 1
          fi

          echo "🔑 [Pre-check] 正在验证 kubeconfig 凭证..."
          mkdir -p /root/.kube
          printf "%s" "$KUBECONFIG_CONTENT" > /root/.kube/config
          
          # 尝试获取节点信息，如果连不上集群，直接在这里报错终止
          if ! kubectl get nodes &> /dev/null; then
              echo "❌ 致命错误: kubeconfig 无效或无法连接到 Kubernetes 集群！"
              exit 1
          fi
          echo "✅ [Pre-check] 环境验证通过，准备开始构建镜像..."

      # ==========================================
      # 🐳 3. 【耗时操作】构建本地 Docker 镜像
      # ==========================================
      - name: Build Docker Image
        run: |
          docker build -t auto-call-phone:latest .

      # ==========================================
      # 🚀 4. 部署到 Kubernetes
      # ==========================================
      - name: Deploy with Kubectl
        container:
          image: bitnami/kubectl:latest 
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # 写入配置文件 (因为步骤间环境不共享，需要重新写入)
          mkdir -p /root/.kube
          printf "%s" "$KUBECONFIG_CONTENT" > /root/.kube/config
          
          echo "🚀 正在应用 deployment.yaml..."
          kubectl apply -f deployment.yaml

          echo "⏳ 等待部署滚动更新完成..."
          kubectl rollout status deployment/auto-call-phone --timeout=90s