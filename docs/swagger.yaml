definitions:
  viewmodels.PhoneStatus:
    properties:
      phone_number:
        type: integer
      remark:
        type: string
      status:
        type: integer
    type: object
  viewmodels.UploadPhoneExcelRsp:
    properties:
      effective_count:
        description: 有效数量
        type: integer
      int:
        description: 总共数量
        type: integer
      list:
        items:
          $ref: '#/definitions/viewmodels.PhoneStatus'
        type: array
      repeat:
        type: integer
    type: object
info:
  contact: {}
paths:
  /upload_excel:
    post:
      consumes:
      - multipart/form-data
      description: Excel上传电话号码
      parameters:
      - description: 要上传的 Excel 文件
        in: formData
        name: file
        required: true
        type: file
      - description: 用户 ID
        in: formData
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/viewmodels.UploadPhoneExcelRsp'
      summary: Excel上传电话号码
      tags:
      - Excel模块
swagger: "2.0"
