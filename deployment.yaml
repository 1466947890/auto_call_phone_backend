apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-call-phone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-call-phone
  template:
    metadata:
      labels:
        app: auto-call-phone
    spec:
      containers:
        - name: auto-call-phone
          image: auto-call-phone:latest
          imagePullPolicy: Never  # ⚠️ 关键：强制 K8s 使用本地镜像
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: auto-call-phone-service
spec:
  selector:
    app: auto-call-phone
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer